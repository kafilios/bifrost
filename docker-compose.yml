# managed via ./ops/up (builds image, injects secrets and cleans
# up the ephemeral .env).  Do not invoke `docker compose` directly.
name: bifrost

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - APP_NAME
      - APP_NPX_PACKAGE
      - TAILSCALE_AUTHKEY
      - JINA_AUTH_HEADER
      - DEEPSEEK_API_KEY
      - NVIDIA_API_KEY
      - OLLAMA_API_KEY
      - OPENROUTER_API_KEY
      - XAI_API_KEY
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - tailscale-state:/var/lib/tailscale

volumes:
  tailscale-state: {}
