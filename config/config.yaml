$schema: "https://www.getbifrost.ai/schema"
governance:
  routing_rules:
    - cel_expression: 'model == "auto"'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: oswe-vscode-prime
          provider: github-copilot
          weight: 1
    - cel_expression: 'model == "auto-code"'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: oswe-vscode-prime
          provider: github-copilot
          weight: 1
    - cel_expression: 'model == "auto-reason"'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: oswe-vscode-prime
          provider: github-copilot
          weight: 1
    - cel_expression: 'model == "auto-agent"'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: oswe-vscode-prime
          provider: github-copilot
          weight: 1
mcp:
  client_configs:
    - auth_type: headers
      connection_string: https://mcp.jina.ai/v1
      connection_type: http
      headers:
        Authorization: env.JINA_AUTH_HEADER
      is_code_mode_client: true
      name: jina
      tools_to_execute:
        - "*"
    - connection_type: stdio
      is_code_mode_client: true
      name: browser
      stdio_config:
        args:
          - -y
          - chrome-devtools-mcp@latest
          - --ws-endpoint=wss://browserless.tail39d2.ts.net/
        command: npx
      tools_to_execute:
        - "*"
providers:
  github-copilot:
    custom_provider_config:
      base_provider_type: openai
    keys:
      - models: []
        name: passthrough
        value: not-required
        weight: 1.0
    network_config:
      base_url: https://claude-gh-copilot-relay.tail39d2.ts.net
  ollama-cloud:
    custom_provider_config:
      base_provider_type: openai
    keys:
      - models: []
        name: ollama-cloud-key
        value: env.OLLAMA_API_KEY
        weight: 1.0
    network_config:
      base_url: https://ollama.com
  openrouter:
    keys:
      - models: []
        name: openrouter-key
        value: env.OPENROUTER_API_KEY
        weight: 1.0
  nvidia:
    custom_provider_config:
      base_provider_type: openai
    keys:
      - models: []
        name: nvidia-key
        value: env.NVIDIA_API_KEY
        weight: 1.0
    network_config:
      base_url: https://integrate.api.nvidia.com
  xai:
    keys:
      - models: []
        name: xai-key
        value: env.XAI_API_KEY
        weight: 1.0
