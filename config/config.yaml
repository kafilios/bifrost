$schema: "https://www.getbifrost.ai/schema"
client:
  allowed_origins:
    - "*"
  allowed_headers:
    - "*"
governance:
  complexity_analyzer_config:
    semantic:
      provider: nvidia
      embedding_model: nvidia/nemotron-3-embed-1b
      timeout: 1.5s
      min_similarity: 0
      message_history_count: 1
      count_toward_budgets: false
      vector_store: embedded
      fallback: llm
    llm:
      provider: minimax
      model: minimax-m2.7
      timeout: 4s
      prompt: ""
      message_history_count: 1
      count_toward_budgets: false
    session:
      enabled: true
    keywords:
      simple_keywords:
        - "what is a mutex?"
        - "fix the grammar in this sentence."
        - "rename this variable to total_count."
        - "what does this CSS class do?"
        - "convert this paragraph to a bullet list."
        - "show me the table of contents for this wiki."
        - "what's the difference between == and === in JavaScript?"
        - "spell-check this paragraph."
        - "format this as JSON."
        - "what year was Markdown created?"
        - "list the sheets in this Excel workbook."
        - "what font is this document using?"
      medium_keywords:
        - "add api-key auth: hash the keys, reject revoked ones, and never log them."
        - "build a contact form in HTML with client-side email validation."
        - "convert this Excel sheet into a markdown table."
        - "refactor this function to use async/await."
        - "write a 100-word summary of this document."
        - "add a sticky header with logo and nav menu to this page."
        - "create a Python script that reads a CSV and prints row counts per column."
        - "make this chart 16:9 with a legend and axis labels."
        - "write unit tests for this function covering the happy path and two edge cases."
        - "add a dark-mode toggle that persists across page reloads."
        - "merge these two Excel sheets on the email column, keeping only matching rows."
        - "translate this README from English to Japanese."
      complex_keywords:
        - "balance testing, prescribing rules, and staffing against rising resistant infections."
        - "design a wiki that handles cross-linking, version history, and search across thousands of pages."
        - "plan a migration of all Word and Excel docs to a new schema while keeping the legacy views working."
        - "redesign a marketing site for accessibility, performance, and SEO without breaking existing URLs."
        - "build an internal dashboard with auth, role-based views, and CSV export."
        - "set up a CI pipeline that lints, tests, builds, and deploys across three environments."
        - "design a multi-tenant document system with row-level security, audit logs, and retention policies."
        - "plan a content migration from a legacy wiki to a new platform while preserving backlinks, attachments, and edit history."
        - "build a spreadsheet-driven financial model with scenario analysis, charts, and a one-page exec summary."
        - "design a knowledge base that integrates with our chat tool, supports markdown and embeds, and indexes full-text search across attachments."
        - "architect a publishing pipeline that takes a markdown draft, runs editorial review, generates PDFs and HTML, and syncs to the website."
        - "build an intranet portal that combines a wiki, document library, employee directory, and announcement feed."
  routing_rules:
    - id: auto-complex
      cel_expression: 'model.contains("auto") && complexity_tier == "COMPLEX"'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m3
          provider: minimax
          weight: 1
    - id: auto-medium
      cel_expression: 'model.contains("auto") && complexity_tier == "MEDIUM"'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m2.7
          provider: minimax
          weight: 1
    - id: auto-simple
      cel_expression: 'model.contains("auto") && complexity_tier == "SIMPLE"'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m2.7
          provider: minimax
          weight: 1
    - id: auto-fallback
      cel_expression: 'model.contains("auto")'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m2.7
          provider: minimax
          weight: 1
    - id: claude-compat-minimax-m3
      cel_expression: 'model.contains("claude-mx-m3")'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m3
          provider: minimax
          weight: 1
    - id: claude-compat-minimax-m2.7
      cel_expression: 'model.contains("claude-mx-m2_7")'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m2.7
          provider: minimax
          weight: 1
    - id: reroute-claude-fable
      cel_expression: 'model.contains("claude-fable")'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m3
          provider: minimax
          weight: 1
    - id: reroute-claude-opus
      cel_expression: 'model.contains("claude-opus")'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m3
          provider: minimax
          weight: 1
    - id: reroute-claude-sonnet
      cel_expression: 'model.contains("claude-sonnet")'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m2.7
          provider: minimax
          weight: 1
    - id: reroute-claude-haiku
      cel_expression: 'model.contains("claude-haiku") || model.contains("claude-3-haiku")'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m2.7
          provider: minimax
          weight: 1
mcp:
  client_configs:
    - auth_type: headers
      connection_string: https://mcp.jina.ai/v1
      connection_type: http
      headers:
        Authorization: env.JINA_AUTH_HEADER
      is_code_mode_client: true
      name: jina
      tools_to_execute:
        - "*"
    - connection_type: stdio
      is_code_mode_client: true
      name: browser
      stdio_config:
        args:
          - -y
          - chrome-devtools-mcp@latest
          - --ws-endpoint=wss://browserless.tail39d2.ts.net/
        command: npx
      tools_to_execute:
        - "*"
providers:
  deepseek:
    custom_provider_config:
      base_provider_type: openai
    keys:
      - models: 
          - '*'
        name: deepseek-key
        value: env.DEEPSEEK_API_KEY
        weight: 1.0
    network_config:
      base_url: https://api.deepseek.com
  minimax:
    custom_provider_config:
      base_provider_type: anthropic
    keys:
      - models: 
          - '*'
        name: minimax-key
        value: env.MINIMAX_API_KEY
        weight: 1.0
    network_config:
      base_url: https://api.minimax.io/anthropic
  ollama-cloud:
    custom_provider_config:
      base_provider_type: openai
    keys:
      - models: 
          - '*'
        name: ollama-cloud-key
        value: env.OLLAMA_API_KEY
        weight: 1.0
    network_config:
      base_url: https://ollama.com
  openrouter:
    keys:
      - models: 
          - '*'
        name: openrouter-key
        value: env.OPENROUTER_API_KEY
        weight: 1.0
  nvidia:
    custom_provider_config:
      base_provider_type: openai
    keys:
      - models: 
          - '*'
        name: nvidia-key
        value: env.NVIDIA_API_KEY
        weight: 1.0
    network_config:
      base_url: https://integrate.api.nvidia.com
  xai:
    keys:
      - models: 
          - '*'
        name: xai-key
        value: env.XAI_API_KEY
        weight: 1.0
