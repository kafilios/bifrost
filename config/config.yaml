$schema: "https://www.getbifrost.ai/schema"
client:
  allowed_origins:
    - "*"
  allowed_headers:
    - "*"
governance:
  complexity_analyzer_config:
    semantic:
      provider: nvidia
      embedding_model: nvidia/nemotron-3-embed-1b
      timeout: 1.5s
      min_similarity: 0
      message_history_count: 1
      count_toward_budgets: false
      vector_store: embedded
      fallback: llm
    llm:
      provider: minimax
      model: minimax-m2.7
      timeout: 4s
      prompt: ""
      message_history_count: 1
      count_toward_budgets: false
    session:
      enabled: true
    keywords:
      simple_keywords:
        - "what is a mutex?"
        - "fix the grammar in this sentence."
      medium_keywords:
        - "add api-key auth: hash the keys, reject revoked ones, and never log them."
      complex_keywords:
        - "balance testing, prescribing rules, and staffing against rising resistant infections."
  routing_rules:
    - id: auto-reasoning
      cel_expression: 'model.contains("auto") && complexity_tier == "REASONING"'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m3
          provider: minimax
          weight: 1
    - id: auto-complex
      cel_expression: 'model.contains("auto") && complexity_tier == "COMPLEX"'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m3
          provider: minimax
          weight: 1
    - id: auto-medium
      cel_expression: 'model.contains("auto") && complexity_tier == "MEDIUM"'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m2.7
          provider: minimax
          weight: 1
    - id: auto-simple
      cel_expression: 'model.contains("auto") && complexity_tier == "SIMPLE"'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m2.7
          provider: minimax
          weight: 1
    - id: auto-fallback
      cel_expression: 'model.contains("auto")'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m2.7
          provider: minimax
          weight: 1
    - id: reroute-claude-fable
      cel_expression: 'model.contains("claude-fable")'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m3
          provider: minimax
          weight: 1
    - id: reroute-claude-opus
      cel_expression: 'model.contains("claude-opus")'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m3
          provider: minimax
          weight: 1
    - id: reroute-claude-sonnet
      cel_expression: 'model.contains("claude-sonnet")'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m2.7
          provider: minimax
          weight: 1
    - id: reroute-claude-haiku
      cel_expression: 'model.contains("claude-haiku") || model.contains("claude-3-haiku")'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m2.7
          provider: minimax
          weight: 1
mcp:
  client_configs:
    - auth_type: headers
      connection_string: https://mcp.jina.ai/v1
      connection_type: http
      headers:
        Authorization: env.JINA_AUTH_HEADER
      is_code_mode_client: true
      name: jina
      tools_to_execute:
        - "*"
    - connection_type: stdio
      is_code_mode_client: true
      name: browser
      stdio_config:
        args:
          - -y
          - chrome-devtools-mcp@latest
          - --ws-endpoint=wss://browserless.tail39d2.ts.net/
        command: npx
      tools_to_execute:
        - "*"
providers:
  deepseek:
    custom_provider_config:
      base_provider_type: openai
    keys:
      - models: 
          - '*'
        name: deepseek-key
        value: env.DEEPSEEK_API_KEY
        weight: 1.0
    network_config:
      base_url: https://api.deepseek.com
  minimax:
    custom_provider_config:
      base_provider_type: anthropic
    keys:
      - models: 
          - '*'
        name: minimax-key
        value: env.MINIMAX_API_KEY
        weight: 1.0
    network_config:
      base_url: https://api.minimax.io/anthropic
  ollama-cloud:
    custom_provider_config:
      base_provider_type: openai
    keys:
      - models: 
          - '*'
        name: ollama-cloud-key
        value: env.OLLAMA_API_KEY
        weight: 1.0
    network_config:
      base_url: https://ollama.com
  openrouter:
    keys:
      - models: 
          - '*'
        name: openrouter-key
        value: env.OPENROUTER_API_KEY
        weight: 1.0
  nvidia:
    custom_provider_config:
      base_provider_type: openai
    keys:
      - models: 
          - '*'
        name: nvidia-key
        value: env.NVIDIA_API_KEY
        weight: 1.0
    network_config:
      base_url: https://integrate.api.nvidia.com
  xai:
    keys:
      - models: 
          - '*'
        name: xai-key
        value: env.XAI_API_KEY
        weight: 1.0
