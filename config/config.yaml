$schema: "https://www.getbifrost.ai/schema"
client:
  allowed_origins:
    - "*"
  allowed_headers:
    - "*"
governance:
  routing_rules:
    - cel_expression: 'complexity_tier in ["COMPLEX", "REASONING"]'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m3
          provider: minimax
          weight: 1
    - cel_expression: 'complexity_tier in ["SIMPLE", "MEDIUM"]'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m2.7
          provider: minimax
          weight: 1
    - cel_expression: 'model.contains("claude-fable")'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m3
          provider: minimax
          weight: 1
    - cel_expression: 'model.contains("claude-opus")'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m3
          provider: minimax
          weight: 1
    - cel_expression: 'model.contains("claude-sonnet")'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m2.7
          provider: minimax
          weight: 1
    - cel_expression: 'model.contains("claude-haiku")'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m2.7
          provider: minimax
          weight: 1
    - cel_expression: 'model.contains("claude-3-haiku")'
      chain_rule: false
      enabled: true
      scope: global
      targets:
        - model: minimax-m2.7
          provider: minimax
          weight: 1
mcp:
  client_configs:
    - auth_type: headers
      connection_string: https://mcp.jina.ai/v1
      connection_type: http
      headers:
        Authorization: env.JINA_AUTH_HEADER
      is_code_mode_client: true
      name: jina
      tools_to_execute:
        - "*"
    - connection_type: stdio
      is_code_mode_client: true
      name: browser
      stdio_config:
        args:
          - -y
          - chrome-devtools-mcp@latest
          - --ws-endpoint=wss://browserless.tail39d2.ts.net/
        command: npx
      tools_to_execute:
        - "*"
providers:
  deepseek:
    custom_provider_config:
      base_provider_type: openai
    keys:
      - models: 
          - '*'
        name: deepseek-key
        value: env.DEEPSEEK_API_KEY
        weight: 1.0
    network_config:
      base_url: https://api.deepseek.com
  minimax:
    custom_provider_config:
      base_provider_type: anthropic
    keys:
      - models: 
          - '*'
        name: minimax-key
        value: env.MINIMAX_API_KEY
        weight: 1.0
    network_config:
      base_url: https://api.minimax.io/anthropic
  ollama-cloud:
    custom_provider_config:
      base_provider_type: openai
    keys:
      - models: 
          - '*'
        name: ollama-cloud-key
        value: env.OLLAMA_API_KEY
        weight: 1.0
    network_config:
      base_url: https://ollama.com
  openrouter:
    keys:
      - models: 
          - '*'
        name: openrouter-key
        value: env.OPENROUTER_API_KEY
        weight: 1.0
  nvidia:
    custom_provider_config:
      base_provider_type: openai
    keys:
      - models: 
          - '*'
        name: nvidia-key
        value: env.NVIDIA_API_KEY
        weight: 1.0
    network_config:
      base_url: https://integrate.api.nvidia.com
  xai:
    keys:
      - models: 
          - '*'
        name: xai-key
        value: env.XAI_API_KEY
        weight: 1.0
